  <style>
:root {
  color-scheme: light;
  --bg: #fbf5ea;
  --card: #fffdf8;
  --ink: #4a3426;
  --muted: #6b5744;
  --line: #eadcc6;
  --accent: #a44829;
  --terra: #d8704a;
  --mustard: #e9b44c;
  --olive: #8aa35e;
  --soft: #f3e0c7;
  --sage: #dde6c4;
  --radius: 18px;
  --shadow: 0 5px 20px #4a342606;
  --heading: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif SC", serif;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 100px; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: #7a341e; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { color: var(--ink); }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #a44829; outline-offset: 4px; }
::selection { background: #f2cf83; color: #7a341e; }
img, svg { display: block; max-width: 100%; }
.container { max-width: 1160px; margin: 0 auto; padding: 36px 32px 64px; }
#app:focus { outline: none; }
.skip-link { position: fixed; z-index: 40; top: -100px; left: 20px; padding: 12px 18px; background: var(--ink); color: white; border-radius: 12px; }
.skip-link:focus { top: 12px; color: white; }
.site-header { position: sticky; top: 0; z-index: 20; background: #fbf5eaf2; backdrop-filter: blur(14px); box-shadow: 0 1px 0 #9a693b12; }
.header-inner { max-width: 1280px; min-height: 88px; padding: 12px 32px; margin: auto; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); flex-shrink: 0; }
.brand-icon { width: 52px; height: 52px; }
.brand-text { font: 700 24px/1.2 var(--heading); letter-spacing: .06em; white-space: nowrap; }
.header-search { display: flex; align-items: center; margin: 0 auto 0 8px; width: 220px; background: #fffdf8; border: 1px solid var(--line); border-radius: 12px; }
.header-search input { width: 100%; min-width: 0; padding: 9px 0 9px 14px; border: 0; border-radius: 12px; background: transparent; font-size: 14px; outline-offset: 0; }
.header-search button { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; border: 0; border-radius: 11px; background: var(--mustard); }
.header-search button:hover { background: #dfaa43; }
.header-search svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.top-nav { display: flex; gap: 4px; flex-shrink: 0; }
.top-nav a { padding: 9px 13px; border-radius: 10px; font-size: 14px; white-space: nowrap; color: var(--muted); transition: color .18s, background .18s; }
.top-nav a:hover, .top-nav a[aria-current="page"] { background: #e9b44c; color: var(--ink); }
.top-nav a[aria-current="page"] { font-weight: 600; }
.hero { display: grid; grid-template-columns: 1fr 200px; align-items: center; gap: 32px; padding: 9px 14px 34px 0; margin-bottom: 18px; }
.eyebrow { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.home-title { margin: 0 0 14px; font: 700 clamp(28px, 3.2vw, 40px)/1.3 var(--heading); letter-spacing: .035em; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: baseline; margin: 20px 0 0; font-size: 13px; color: var(--muted); }
.hero-meta strong { font: 500 24px/1.2 Georgia, serif; margin-right: 4px; color: var(--ink); }
.hero-meta a { font-weight: 600; }
.hero-meta a span { margin-left: 7px; }
.hero-art { display: grid; place-items: center; position: relative; }
.hero-art::before { content: ""; position: absolute; inset: -16px; background: radial-gradient(ellipse, #f3e0c7cc, #dde6c499 45%, transparent 70%); z-index: -1; }
.hero-art img { width: 176px; height: 176px; transform: rotate(-5deg); }
.home-layout { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 36px; align-items: start; }
.section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 18px; }
.section-heading h2, .contribute-panel h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .02em; }
.section-heading > span { font-size: 12px; color: var(--muted); }
.scene-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { display: block; color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); transition: border-color .18s, background .18s, box-shadow .18s; }
.card:hover { color: var(--ink); border-color: #d5a66b; box-shadow: 0 6px 20px #4a34260d; }
.scene { padding: 19px 20px 18px; position: relative; }
.scene-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
.category-icon { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 12px; background: var(--tone, #f3e0c7); color: var(--tone-ink, #271b13); }
.category-icon svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.scene-count { color: var(--muted); font-size: 12px; }
.scene h3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 16px; margin: 0 0 4px; font-weight: 600; }
.card-arrow { font-size: 18px; color: #a85b35; font-weight: 400; transition: transform .18s; }
.card:hover .card-arrow { transform: translate(2px, -2px); }
.scene p { margin: 0; font-size: 13px; }
.scene .scene-purpose { color: #7a4a22; }
.scene .example { color: var(--muted); font-size: 12px; margin-top: 7px; }
.tone-1 { --tone: #d8704a; }
.tone-2 { --tone: #e9b44c; }
.tone-3 { --tone: #8aa35e; }
.tone-4 { --tone: #5e9c94; }
.tone-5 { --tone: #a8653a; --tone-ink: #ffffff; }
.tone-6 { --tone: #d08c5b; }
.tone-7 { --tone: #6f8f4e; }
.tone-8 { --tone: #9c8c74; }
.all-games { background: #f7e6bb; border-color: #e6ce92; }
.all-games .category-icon { background: #e9b44c; font: 30px/1 Georgia, serif; }
.home-aside { display: grid; gap: 22px; }
.level-list { display: grid; gap: 9px; }
.level-card { display: block; padding: 16px 18px; border-radius: 14px; background: #dde6c4; border: 1px solid transparent; transition: border-color .18s; }
.level-card:hover { border-color: #d5a66b; }
.level-2 { background: #f5dda7; }
.level-3 { background: #f4d1bf; }
.level-0 { background: #e6e0d6; }
.level-head { display: flex; align-items: center; gap: 11px; }
.level-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.level-stars { font-size: 13px; color: #a44829; letter-spacing: 1px; }
.level-count { margin-left: auto; font-size: 12px; color: var(--muted); }
.level-card p { font-size: 12px; line-height: 1.7; margin: 7px 0 0; color: #6b5744; }
.level-note { margin: 12px 3px 0; font-size: 12px; color: var(--muted); }
.contribute-panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; background: #fff3d8; }
.mini-label { display: block; color: var(--muted); font-size: 11px; letter-spacing: .12em; margin-bottom: 7px; }
.contribute-panel h2 { font-size: 16px; }
.contribute-panel p { font-size: 13px; margin: 9px 0 14px; color: var(--muted); }
.contribute-panel a { font-size: 13px; font-weight: 600; }
.contribute-panel a span { margin-left: 7px; }
.edition-note { font-size: 12px; color: var(--muted); padding: 0 3px; }
.edition-note summary { cursor: pointer; width: fit-content; }
.edition-note p { margin: 8px 0 0; }
.crumb { font-size: 13px; margin: 0 0 22px; color: var(--muted); overflow-wrap: anywhere; }

    "完整规则": "原始资料有完整规则",
    "复玩方案": "由索引整理的复玩方案，使用前请带领人确认",
    "待补充": "原始资料只留名称与线索，规则待补录"
  };
  var LEVELS = [
    { level: 1, name: "入门", desc: "零基础也能上手，适合新孩子和第一次带领。" },
    { level: 2, name: "进阶", desc: "需要一定手语基础，规则稍多，适合熟悉后的小团。" },
    { level: 3, name: "挑战", desc: "规则复杂或时间较长，适合熟练成员和总复习。" }
  ];

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function catOf(key) {
    return window.CATEGORIES.filter(function (c) { return c.key === key; })[0];
  }

  function gamesIn(key) {
    return window.GAMES.filter(function (g) { return g.cat === key; });
  }

  function gameIndex(id) {
    for (var i = 0; i < window.GAMES.length; i++) {
      if (window.GAMES[i].id === id) return i;
    }
    return -1;
  }

  function gameById(id) {
    var i = gameIndex(id);
    return i === -1 ? null : window.GAMES[i];
  }

  function metaOf(g) {
    return (window.META || {})[g.id] || { players: "待补充", duration: "待补充", level: 0 };
  }

  function gamesAtLevel(level) {
    return window.GAMES.filter(function (g) { return metaOf(g).level === level; });
  }

  function stars(level) {
    var s = "";
    for (var i = 1; i <= 3; i++) s += i <= level ? "★" : "☆";
    return s;
  }

  function levelName(level) {
    return LEVELS.filter(function (l) { return l.level === level; })[0].name;
  }

  function levelChip(level) {
    if (!level) return '<span class="chip chip-todo">难度：待定</span>';
    return '<span class="chip chip-level">' + stars(level) + ' ' + levelName(level) + '</span>';
  }

  function chips(g) {
    var m = metaOf(g);
    return '<span class="chip">人数：' + esc(m.players) + '</span>' +
      '<span class="chip">时长：' + esc(m.duration) + '</span>' +
      levelChip(m.level);
  }

  // 网页在线打开时用相对路径；单独下载 HTML 到本地打开时，改用线上地址
  function fileHref(path) {
    var base = location.protocol === "file:" && window.SITE.remoteBase ? window.SITE.remoteBase : "../";
    return base + encodeURI(path);
  }

  function fileName(path) {
    return path.split("/").pop();
  }

  function statusTag(status) {
    return '<span class="status ' + STATUS_CLASS[status] + '">' + esc(status) + "</span>";
  }

  function list(items, tag) {
    return "<" + tag + ' class="guide-list">' + items.map(function (t) {
      return "<li>" + esc(t) + "</li>";
    }).join("") + "</" + tag + ">";
  }

  function backButton(href, label) {

  }

  function fileIndex() {
    var map = {};
    window.GAMES.forEach(function (g) {
      g.resources.forEach(function (p) {

      });
    });

  }

    var cat = catOf(g.cat);
    return '<a class="game-item" href="#/game/' + esc(g.id) + '">' +

      '<div class="game-body"><h3>' + esc(g.title) + statusTag(g.status) + '</h3>' +
      '<p>' + esc(g.summary) + '</p>' +
      '<div class="chips">' + chips(g) + '</div></div></a>';
  }

    document.getElementById("feedback-form").addEventListener("submit", function (e) {

      var email = window.SITE.feedbackEmail;
      var subject = encodeURIComponent(window.SITE.title + "反馈 · " + f.game.value);
      var body = encodeURIComponent(text);
      var mailBtn = email
        ? '<a class="btn" href="mailto:' + esc(email) + '?subject=' + subject + '&body=' + body + '">用邮件发送</a>'
        : '<span class="note">尚未设置接收邮箱，请复制下方内容发送给负责人。</span>';
      document.getElementById("feedback-result").innerHTML =
        '<div class="feedback-result"><h3 class="sub-title">反馈内容</h3>' +
        '<textarea readonly rows="7" id="feedback-text">' + esc(text) + '</textarea>' +
        '<p class="form-actions">' + mailBtn + ' <button type="button" class="btn ghost" id="copy-btn">复制内容</button>' +
        ' <button type="button" class="btn ghost" id="refill-btn">重新填写</button></p></div>';
      f.style.display = "none";
      document.getElementById("refill-btn").addEventListener("click", function () {
        document.getElementById("feedback-result").innerHTML = "";
        f.reset();
        f.style.display = "";
      });
      document.getElementById("copy-btn").addEventListener("click", function () {
        var btn = this;
        var box = document.getElementById("feedback-text");
        function done() { btn.textContent = "已复制"; }
        function fallback() {
          box.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (err) {}
          if (ok) done(); else btn.textContent = "复制失败，请手动选中复制";
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(box.value).then(done, fallback);
        } else {
          fallback();
        }
      });
    });
  }

  function parseQuery(qs) {
    var out = {};
    (qs || "").split("&").forEach(function (pair) {
      if (!pair) return;
      var kv = pair.split("=");
      out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    });
    return out;
  }

  function haystack(g) {
    var m = metaOf(g);
    var cat = catOf(g.cat);
    var guide = (window.GUIDES || {})[g.id] || {};
    var parts = [
      g.id, g.title, g.summary, g.status,
      cat ? cat.name : "", m.players, m.duration, m.level ? levelName(m.level) : "待定",
      guide.scene || "", (guide.prep || []).join(" "), (guide.steps || []).join(" "),
      guide.scoring || "", (guide.notes || []).join(" "), (guide.versions || []).join(" ")
    ];
    return parts.join(" ").toLowerCase();
  }

  function renderSearch(qs) {
    var p = parseQuery(qs);
    var catOptions = '<option value="">全部分类</option>' + window.CATEGORIES.map(function (c) {
      return '<option value="' + c.key + '"' + (p.cat === c.key ? " selected" : "") + '>' + esc(c.name) + '</option>';
    }).join("");
    var levelOptions = '<option value="">全部难度</option>' +
      LEVELS.map(function (l) {
        return '<option value="' + l.level + '"' + (p.level === String(l.level) ? " selected" : "") + '>' + stars(l.level) + ' ' + esc(l.name) + '</option>';
      }).join("") +
      '<option value="0"' + (p.level === "0" ? " selected" : "") + '>待定</option>';
    var statusOptions = '<option value="">全部状态</option>' + ["完整规则", "复玩方案", "待补充"].map(function (s) {
      return '<option value="' + s + '"' + (p.status === s ? " selected" : "") + '>' + s + '</option>';
    }).join("");

    app.innerHTML =
      '<div class="page-head"><h1 class="page-title">搜索与筛选</h1></div>' +
      '<div class="search-panel">' +
        '<input id="s-q" type="search" aria-label="搜索游戏关键词" placeholder="例如：数字、故事、拆弹、两人" value="' + esc(p.q || "") + '">' +
        '<div class="filters">' +
          '<label>分类<select id="s-cat">' + catOptions + '</select></label>' +
          '<label>难度<select id="s-level">' + levelOptions + '</select></label>' +
          '<label>状态<select id="s-status">' + statusOptions + '</select></label>' +
          '<button type="button" class="btn ghost" id="s-reset">清空条件</button>' +
        '</div>' +
      '</div>' +
      '<p class="note" id="s-count" role="status" aria-live="polite"></p>' +
      '<div class="game-list" id="s-results"></div>' +
      backButton("#/", "首页");

    function refresh() {
      var q = document.getElementById("s-q").value.trim();
      var cat = document.getElementById("s-cat").value;
      var level = document.getElementById("s-level").value;
      var status = document.getElementById("s-status").value;
      document.getElementById("header-search").elements.q.value = q;
      var terms = q.toLowerCase().split(/\s+/).filter(Boolean);

      var results = window.GAMES.filter(function (g) {
        if (cat && g.cat !== cat) return false;
        if (level !== "" && String(metaOf(g).level) !== level) return false;
        if (status && g.status !== status) return false;
        var h = haystack(g);
        return terms.every(function (t) { return h.indexOf(t) !== -1; });
      });

      document.getElementById("s-count").textContent = "共找到 " + results.length + " 个游戏";
      document.getElementById("s-results").innerHTML = results.length
        ? results.map(function (g) { return gameLink(g); }).join("")
        : '<p class="empty">没有符合条件的游戏，换个关键词或放宽筛选条件试试。</p>';

      var qs = [];
      if (q) qs.push("q=" + encodeURIComponent(q));
      if (cat) qs.push("cat=" + cat);
      if (level !== "") qs.push("level=" + level);
      if (status) qs.push("status=" + encodeURIComponent(status));
      try {
        history.replaceState(null, "", "#/search" + (qs.length ? "?" + qs.join("&") : ""));
      } catch (err) {
        // 本地 file:// 打开时浏览器可能禁止修改地址，此时忽略即可
      }
    }

    ["s-q", "s-cat", "s-level", "s-status"].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener(id === "s-q" ? "input" : "change", refresh);
    });
    document.getElementById("s-reset").addEventListener("click", function () {
      document.getElementById("s-q").value = "";
      document.getElementById("s-cat").value = "";
      document.getElementById("s-level").value = "";
      document.getElementById("s-status").value = "";
      refresh();
    });
    refresh();
  }

  function renderFiles() {
    var idmap = fileIndex();
    var sections = window.CATEGORIES.map(function (c) {
      var files = [];
      gamesIn(c.key).forEach(function (g) {
        g.resources.forEach(function (p) {
          if (files.indexOf(p) === -1) files.push(p);
        });
      });
      var body = files.length
        ? '<ul class="file-list">' + files.map(function (p) {
            var ids = (idmap[p] || []).join("、");
            return '<li><a class="dl" href="' + fileHref(p) + '" download aria-label="下载 ' + esc(fileName(p)) + '">下载</a>' +
              '<a href="' + fileHref(p) + '">' + esc(fileName(p)) + '</a>' +
              '<span class="file-ids">对应游戏：' + esc(ids) + '</span></li>';
          }).join("") + '</ul>'
        : '<p class="empty">暂无文件</p>';
      return '<h2 class="sec-title">' + esc(c.name) + '</h2>' + body;
    }).join("");

    app.innerHTML =
      '<div class="page-head"><h1 class="page-title">资料下载</h1></div>' +
      sections +
      backButton("#/", "首页");
  }

  function renderNotFound() {
    app.innerHTML = '<div class="detail"><h1 class="page-title">页面不存在</h1><p><a href="#/">返回首页</a></p></div>';
  }

  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/");
    if (!hash) return renderHome();
    var search = hash.match(/^search(?:\?(.*))?$/);
    if (search) return renderSearch(search[1] || "");
    if (parts[0] === "cat" && parts[1]) return renderCategory(parts[1]);
    if (parts[0] === "level" && parts[1]) return renderLevel(parts[1]);
    if (parts[0] === "game" && parts[1]) return renderGame(parts[1]);
    if (parts[0] === "todo") return renderTodo();
    if (parts[0] === "files") return renderFiles();
    renderNotFound();
  }

  function setTitle() {
    var h1 = app.querySelector("h1");
    document.title = (h1 ? h1.textContent + " · " : "") + window.SITE.title;
    var section = location.hash.replace(/^#\/?/, "").split(/[/?]/)[0];
    var active = section === "files" || section === "todo" ? "#/" + section :
      (section ? "#/search" : "#/");
    document.querySelectorAll(".top-nav a").forEach(function (link) {
      if (link.getAttribute("href") === active) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
  }

  document.getElementById("site-subtitle").textContent = window.SITE.subtitle + " · " + window.SITE.updated;
  document.querySelector(".skip-link").addEventListener("click", function (e) {
    e.preventDefault();
    app.focus();
  });
  document.getElementById("header-search").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = this.q.value.trim();
    var target = "#/search" + (q ? "?q=" + encodeURIComponent(q) : "");
    if (location.hash === target) { route(); setTitle(); } else { location.hash = target; }
  });

  var toTop = document.getElementById("to-top");
  window.addEventListener("scroll", function () {
    toTop.classList.toggle("show", window.scrollY > 400);
  });
  toTop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  window.addEventListener("hashchange", function () {
    route();
    setTitle();
    window.scrollTo(0, 0);
  });
  route();
  setTitle();
})();

</script>
</body>
</html>
